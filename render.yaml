services:
  # Monolithic App Service (FREE TIER)
  # WARNING: Free tier has 512MB RAM limit - monolith may struggle
  - type: web
    name: grandson-pill-pal
    env: docker
    dockerfilePath: ./Dockerfile.monolith
    plan: free  # FREE TIER (spins down after 15 min inactivity)
    region: oregon
    
    # Environment Variables
    envVars:
      - key: OPENAI_API_KEY
        sync: false  # User must provide this in dashboard
      - key: USE_LOCAL_EXTRACTOR
        value: "true"
      - key: EXTERNAL_DATABASE
        value: "true"  # MUST use external DB (no disk in free tier)
      - key: DATABASE_URL
        fromDatabase:
          name: pillpal-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://grandson-pill-pal.onrender.com

    # NOTE: Disk storage NOT available in free tier
    # Database must be external (managed PostgreSQL)

# Databases (Managed Postgres - FREE for 90 days)
databases:
  - name: pillpal-db
    plan: free  # FREE TIER (expires after 90 days)
    databaseName: pillpal
    user: pillpal
    region: oregon
